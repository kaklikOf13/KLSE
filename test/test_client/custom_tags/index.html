<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="../../../client_side/extra_elements.css"></script>
        <style>
            tabs-container{
                border: 1px solid #c11;
            }
            tabs-container .tabs-header{
                border: 1px solid #c11;
            }
        </style>
    </head>
    <body>
        <script src="../../../client_side/extra_elements.js"></script>
        <tabs-container header-position="left">
            <tab text="aaa">
                aaa
            </tab>
            <tab text="bbb">
                bbb
            </tab>
        </tabs-container>
        <script>
            function init(){
                const menu=new Menu()
                menu.add_option("aaa",(e)=>{console.log(e)})
                document.body.appendChild(menu)
            }
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault()

                const menu=new Menu()
                menu.style.left=`${e.clientX}px`
                menu.style.top=`${e.clientY}px`
                menu.add_option("aaa",(e)=>{console.log(e)})
                const submenu1=new Menu()
                submenu1.add_option("kaklik")
                menu.add_submenu("submenu",submenu1)
                document.body.appendChild(menu)
            });
        </script>
        <kl-menu>
            <kl-option>opt1</kl-option>
            <kl-submenu>
                submenu
                <kl-menu>
                    <kl-option>kl2</kl-option>
                </kl-menu>
            </kl-submenu>
            <kl-submenu>
                submenu2
                <kl-menu>
                    <kl-option>kl3</kl-option>
                    <kl-submenu>
                        child-sub-menu
                        <kl-menu>
                            <kl-option>kl4</kl-option>
                        </kl-menu>
                    </kl-submenu>
                </kl-menu>
            </kl-submenu>
        </kl-menu>
    </body>
</html>
